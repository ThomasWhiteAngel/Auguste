<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mais où est Auguste ?</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#ddd;font-family:Georgia,'Times New Roman',serif;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;background:#000;cursor:crosshair}
#grain,#vig,#hurt,#scan{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.9) 100%)}
#hurt{background:radial-gradient(ellipse at center,rgba(140,0,0,0) 30%,rgba(170,0,0,.85) 100%);opacity:0}
#scan{background:repeating-linear-gradient(0deg,rgba(0,0,0,.10) 0,rgba(0,0,0,.10) 1px,transparent 1px,transparent 3px);mix-blend-mode:multiply}
#grain{opacity:.07;mix-blend-mode:screen;animation:gr .5s steps(5) infinite}
@keyframes gr{0%{background-position:0 0}20%{background-position:-40px 20px}40%{background-position:30px -60px}60%{background-position:-70px -10px}80%{background-position:50px 50px}100%{background-position:0 0}}
#cross{position:fixed;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:1px solid rgba(255,255,255,.55);border-radius:50%;pointer-events:none;display:none}
#cross:after{content:'';position:absolute;left:5px;top:5px;width:2px;height:2px;background:#fff;opacity:.8}
#cross.grab{border-color:#ff3030;transform:scale(1.8)}
#hud{position:fixed;left:16px;top:14px;display:none;pointer-events:none;font:12px/1.2 'Courier New',monospace;letter-spacing:2px;color:#b9b2a0;text-shadow:0 0 4px #000}
#hud .bar{width:190px;height:10px;background:rgba(0,0,0,.65);border:1px solid #5a5446;margin:3px 0 8px}
#hud .bar.sm{height:5px}
#hud .bar i{display:block;height:100%;width:100%;background:#a3201c;transition:width .1s}
#hud .bar.sm i{background:#c9b85a}
#info{position:fixed;right:16px;top:14px;text-align:right;display:none;pointer-events:none;font:13px 'Courier New',monospace;letter-spacing:3px;color:#b9b2a0;text-shadow:0 0 4px #000}
#info b{font-size:20px;color:#d8d0b8}
#mini{position:fixed;right:16px;top:62px;width:140px;height:140px;opacity:.7;display:none;pointer-events:none;border:1px solid #4a4538;background:rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:9%;transform:translateX(-50%);max-width:80%;text-align:center;font-size:22px;color:#e8dfc8;text-shadow:0 0 8px #000,0 0 18px #800;opacity:0;transition:opacity .4s;pointer-events:none;letter-spacing:1px}
#torch{position:fixed;right:7%;bottom:-8%;width:70px;height:260px;border-radius:14px 14px 6px 6px;background:linear-gradient(90deg,#0b0b0c,#2c2c30 40%,#0b0b0c);transform:rotate(-14deg);transform-origin:bottom center;pointer-events:none;display:none;box-shadow:0 0 30px rgba(255,240,180,.08);transition:transform .15s}
#torch:before{content:'';position:absolute;left:-10px;top:-14px;width:90px;height:30px;border-radius:6px;background:linear-gradient(#3a3a40,#121214)}
#torch.grab{transform:rotate(-4deg) translate(-90px,-120px) scale(1.15)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:flex-start;flex-direction:column;text-align:center;background:rgba(0,0,0,.72);z-index:10;padding:20px;overflow:auto}
h1{margin:6px 0 4px;font-size:clamp(30px,6.2vw,76px);letter-spacing:.06em;color:#c0201c;text-shadow:0 0 18px #600,3px 0 #300,-3px 0 #022;animation:jit 3.5s infinite;font-weight:normal;text-transform:uppercase}
@keyframes jit{0%,92%,100%{transform:none;opacity:1}93%{transform:translateX(5px) skewX(6deg);opacity:.6}94%{transform:translateX(-6px);opacity:1}96%{transform:translateX(3px) skewX(-8deg);opacity:.4}}
.face{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:50% 10%;border:3px solid #5c0f0d;box-shadow:0 0 40px #a00,inset 0 0 30px #000;filter:contrast(1.1) brightness(.85) saturate(.8);animation:fl 4s infinite}
@keyframes fl{0%,90%,100%{opacity:1;transform:none}92%{opacity:.25;transform:scale(1.07) translateX(4px)}95%{opacity:.8}97%{opacity:.3}}
.sub{color:#a89f88;max-width:640px;line-height:1.5;margin:8px 0 14px;font-size:16px}
.keys{display:grid;grid-template-columns:auto auto;gap:4px 18px;text-align:left;font:13px 'Courier New',monospace;color:#b9b2a0;margin:6px 0 14px}
.keys b{color:#e8dfc8}
button{font:20px Georgia,serif;letter-spacing:.2em;text-transform:uppercase;background:#2a0705;color:#e8d8c0;border:1px solid #8a1b16;padding:12px 34px;cursor:pointer;margin:6px;transition:.15s}
button:hover{background:#7a110d;box-shadow:0 0 24px #a00}
.set{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;align-items:center;font:13px 'Courier New',monospace;color:#b9b2a0;margin-bottom:8px}
.set input[type=range]{width:120px;vertical-align:middle}
.set select{background:#111;color:#ddd;border:1px solid #555;padding:2px}
.big{font-size:clamp(28px,5vw,56px);margin:0 0 6px}
.dead h1{animation:none}
.win h1{color:#d8c070;text-shadow:0 0 18px #750}

#cine{position:fixed;inset:0;background:#000;z-index:30;display:none}
#cc{width:100%;height:100%;object-fit:cover;display:block}
#skip{position:absolute;right:18px;bottom:14px;color:#8c8470;font:13px 'Courier New',monospace;letter-spacing:3px;cursor:pointer;padding:8px;opacity:.8}
.row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
input{background:#120808;color:#e8dfc8;border:1px solid #6a1a16;padding:8px;user-select:text;-webkit-user-select:text;font:16px 'Courier New',monospace}
#jc{width:130px;text-transform:uppercase;font-size:22px;letter-spacing:.2em;text-align:center}
.code{font:bold 64px 'Courier New',monospace;letter-spacing:.3em;color:#e8dfc8;text-shadow:0 0 20px #a00;margin:6px 0 12px;padding-left:.3em}
.plist{margin:10px 0 14px;min-width:240px}
.pl{padding:6px 14px;border:1px solid #4a1210;margin:3px 0;background:rgba(40,6,5,.6);font:15px 'Courier New',monospace}
.pl.h{color:#e8c070}
button.ghost{background:transparent;border-color:#4a4538;color:#a89f88;font-size:14px;padding:8px 20px}
.err{color:#e05040;margin:6px 0;font:14px 'Courier New',monospace;max-width:500px}
.face.big{width:min(30vh,220px);height:min(30vh,220px)}
#ov>:first-child{margin-top:auto}#ov>:last-child{margin-bottom:auto}
.hint{color:#756d5a;font:13px 'Courier New',monospace;margin:4px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="scan"></div><div id="grain"></div><div id="vig"></div><div id="hurt"></div>
<div id="torch"></div>
<div id="cross"></div>
<div id="hud"><div>SANTÉ</div><div class="bar"><i id="hp"></i></div><div>ENDURANCE</div><div class="bar sm"><i id="st"></i></div></div>
<div id="info"><b id="lvl">NIVEAU 1</b><br><span id="tm">00:00</span></div>
<canvas id="mini" width="140" height="140"></canvas>
<div id="toast"></div>
<div id="cine"><canvas id="cc" width="640" height="360"></canvas><div id="skip">Passer ▸</div></div>
<div id="ov"></div>

(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d'),ov=$('ov'),mini=$('mini'),mctx=mini.getContext('2d');
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}

/* ---------------- Réglages ---------------- */
const settings={bright:1,qual:'auto',voice:true,sound:true};
let autoQ='med';
const QH={low:180,med:240,high:320};

/* ---------------- Rendu : taille / buffers ---------------- */
let W=480,H=270,img,buf32,zb,cone;
function resize(){
  const ww=innerWidth,wh=innerHeight,asp=clamp(ww/wh,1.2,2.4);
  const q=settings.qual==='auto'?autoQ:settings.qual;
  H=QH[q];W=Math.round(H*asp/2)*2;
  cv.width=W;cv.height=H;
  img=ctx.createImageData(W,H);buf32=new Uint32Array(img.data.buffer);
  zb=new Float32Array(W);cone=new Float32Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const dx=(x+.5-W/2)/H-0.02,dy=(y+.5-H/2)/H-0.05;
    const r=Math.sqrt(dx*dx+dy*dy)/0.62;
    cone[y*W+x]=r>=1?0:Math.pow(1-r,1.3);
  }
}

/* ---------------- Textures procédurales ---------------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function noise(g,amt){const id=g.getImageData(0,0,64,64),d=id.data;for(let i=0;i<d.length;i+=4){const n=(Math.random()-.5)*amt;d[i]+=n;d[i+1]+=n;d[i+2]+=n}g.putImageData(id,0,0)}
function toTex(c){const d=c.getContext('2d').getImageData(0,0,64,64).data,t=new Uint8Array(4096*3);for(let i=0;i<4096;i++){t[i*3]=d[i*4];t[i*3+1]=d[i*4+1];t[i*3+2]=d[i*4+2]}return t}
function wallBase(g){
  g.fillStyle='#b3a784';g.fillRect(0,0,64,64);
  for(let x=0;x<64;x+=8){g.fillStyle='rgba(120,105,70,.22)';g.fillRect(x,0,3,64);g.fillStyle='rgba(255,250,220,.09)';g.fillRect(x+4,0,1,64)}
  for(let i=0;i<4;i++){const x=rnd(0,64),y=rnd(0,34),r=rnd(6,14),gr=g.createRadialGradient(x,y,1,x,y,r);gr.addColorStop(0,'rgba(90,70,30,.30)');gr.addColorStop(1,'rgba(90,70,30,0)');g.fillStyle=gr;g.fillRect(0,0,64,64)}
  g.fillStyle='#3b2a1c';g.fillRect(0,57,64,7);g.fillStyle='#5a4530';g.fillRect(0,57,64,1);
  g.fillStyle='rgba(0,0,0,.2)';g.fillRect(0,0,64,2);
}
const wallTex=[];
function buildTextures(){
  let c,g;
  // 0 papier peint
  c=mk(64,64);g=c.getContext('2d');wallBase(g);noise(g,22);wallTex[0]=toTex(c);
  // 1 grosse tache
  c=mk(64,64);g=c.getContext('2d');wallBase(g);
  let gr=g.createRadialGradient(34,22,2,34,26,26);gr.addColorStop(0,'rgba(60,40,12,.7)');gr.addColorStop(1,'rgba(60,40,12,0)');g.fillStyle=gr;g.fillRect(0,0,64,64);
  noise(g,22);wallTex[1]=toTex(c);
  // 2 tableau liège

let S=0,N=0,map,tid,seen,L=0,lampS;
const DX=[1,-1,0,0],DY=[0,0,1,-1];
let R=Math.random;function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genLevel(lv,seed){R=mulberry32(seed|0);
  N=Math.min(15,8+lv);S=N*3+1;
  map=new Uint8Array(S*S).fill(1);tid=new Uint8Array(S*S);seen=new Uint8Array(S*S);
  for(let j=0;j<N;j++)for(let i=0;i<N;i++)for(let b=0;b<2;b++)for(let a=0;a<2;a++)map[(3*j+1+b)*S+3*i+1+a]=0;
  const link=(i,j,k,l)=>{if(k<i||l<j){[i,j,k,l]=[k,l,i,j]}if(k>i){for(let b=0;b<2;b++)map[(3*j+1+b)*S+3*i+3]=0}else{for(let a=0;a<2;a++)map[(3*j+3)*S+3*i+1+a]=0}};
  const vis=new Uint8Array(N*N),st=[[0,0]];vis[0]=1;
  while(st.length){
    const [i,j]=st[st.length-1],nb=[];
    for(let k=0;k<4;k++){const a=i+DX[k],b=j+DY[k];if(a>=0&&b>=0&&a<N&&b<N&&!vis[b*N+a])nb.push([a,b])}
    if(!nb.length){st.pop();continue}
    const [a,b]=nb[(R()*nb.length)|0];link(i,j,a,b);vis[b*N+a]=1;st.push([a,b]);
  }
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){if(i<N-1&&R()<.2)link(i,j,i+1,j);if(j<N-1&&R()<.2)link(i,j,i,j+1)}
  const rooms=Math.floor(N*N/9);
  for(let r=0;r<rooms;r++){
    const i=(R()*(N-1))|0,j=(R()*(N-1))|0;
    link(i,j,i+1,j);link(i,j+1,i+1,j+1);link(i,j,i,j+1);link(i+1,j,i+1,j+1);
    map[(3*j+3)*S+3*i+3]=R()<.75?2:0;
  }
  for(let i=0;i<S*S;i++){
    if(map[i]===2)tid[i]=5;
    else if(map[i]===1){const h=hash2(i%S+lv*13,(i/S)|0),t=h<.55?0:h<.68?1:h<.80?2:h<.90?3:4;tid[i]=t}
  }

}
const solid=(x,y)=>{const ix=x|0,iy=y|0;if(x<0||y<0||ix>=S||iy>=S)return true;return map[iy*S+ix]!==0};
const canMove=(x,y,r)=>!(solid(x-r,y-r)||solid(x+r,y-r)||solid(x-r,y+r)||solid(x+r,y+r));
function hasLOS(x0,y0,x1,y1){const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy),n=Math.ceil(d/.2);for(let i=1;i<n;i++){const t=i/n;if(solid(x0+dx*t,y0+dy*t))return false}return true}
function bfs(sx,sy){
  const dist=new Int16Array(S*S).fill(-1),par=new Int32Array(S*S).fill(-1),q=new Int32Array(S*S);
  let h=0,t=0;const s=sy*S+sx;dist[s]=0;q[t++]=s;
  while(h<t){const c=q[h++],cx=c%S,cy=(c/S)|0,d=dist[c]+1;
    for(let k=0;k<4;k++){const nx=cx+DX[k],ny=cy+DY[k];if(nx<0||ny<0||nx>=S||ny>=S)continue;const n=ny*S+nx;if(map[n]!==0||dist[n]>=0)continue;dist[n]=d;par[n]=c;q[t++]=n}}
  return{dist,par,q,cnt:t};
}

function tilePos(c){return[(c%S)+.5,((c/S)|0)+.5]}
function pickTarget(mode){
  const T=A.tg||P,b=bfs(A.x|0,A.y|0);let cands=[];
  if(mode==='patrol'){
    if(Math.random()<.55){const bp=bfs(T.x|0,T.y|0);for(let i=0;i<bp.cnt;i++){const c=bp.q[i],d=bp.dist[c];if(d>=5&&d<=12&&b.dist[c]>=0)cands.push(c)}}
    if(!cands.length)for(let i=0;i<b.cnt;i++){const c=b.q[i];if(b.dist[c]>=6)cands.push(c)}
  }else if(mode==='repos'){
    for(let i=0;i<b.cnt;i++){const c=b.q[i];if(b.dist[c]>=3&&b.dist[c]<=8)cands.push(c)}
  }else{ // fuite
    const sc=[];for(let i=0;i<b.cnt;i++){const c=b.q[i];if(b.dist[c]>=4&&b.dist[c]<=14){const[x,y]=tilePos(c);sc.push([Math.hypot(x-T.x,y-T.y)+rnd(0,2),c])}}
    sc.sort((a,b)=>b[0]-a[0]);cands=sc.slice(0,5).map(s=>s[1]);
  }
  if(!cands.length)for(let i=1;i<b.cnt;i++)cands.push(b.q[i]);
  if(!cands.length){A.path=[];A.pi=0;return}
  const t=cands[(Math.random()*cands.length)|0];
  const p=[];let c=t;while(c>=0&&b.par[c]>=0){p.push(c);c=b.par[c]}p.reverse();
  A.path=p;A.pi=0;A.mode=mode;

}

function project(x,y){
  const dirX=Math.cos(P.a),dirY=Math.sin(P.a),pl=.5*W/H,plX=-dirY*pl,plY=dirX*pl;
  const sx=x-P.x,sy=y-P.y,inv=1/(plX*dirY-dirX*plY);
  const tX=inv*(dirY*sx-dirX*sy),tY=inv*(-plY*sx+plX*sy);
  return{tX,tY,scr:(W/2)*(1+tX/tY)};
}
function tryGrab(ax,ay){
  if(P.dead)return;
  $('torch').classList.add('grab');$('cross').classList.add('grab');
  setTimeout(()=>{$('torch').classList.remove('grab');$('cross').classList.remove('grab')},180);
  const pr=project(A.x,A.y),dist=Math.hypot(A.x-P.x,A.y-P.y);
  let hit=false;
  if(pr.tY>.1&&hasLOS(P.x,P.y,A.x,A.y)){
    const sh=H/pr.tY*.8,sw=sh*.5*1.5,floorY=H/2+H/(2*pr.tY),top=floorY-sh;
    hit=Math.abs(ax-pr.scr)<sw/2&&ay>top-6&&ay<floorY+6;
  }
  if(hit){
    if(dist<=3.4){
      if(net.mode==='client'){try{net.conn.send({t:'caught'})}catch(e){}}
      else if(net.mode==='host')hostWin(net.name);
      else caught(null);
    }else{toast('Trop loin ! Approche-toi encore…',1800);sfx.miss()}
  }else sfx.miss();
}

const PFX='ouest-auguste-';
const netOK=()=>typeof Peer!=='undefined';
const makeCode=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=a[(Math.random()*a.length)|0];return s};
function broadcast(m){for(const id in net.conns){try{net.conns[id].send(m)}catch(e){}}}
function leaveNet(){try{net.peer&&net.peer.destroy()}catch(e){}net.peer=null;net.conn=null;net.conns={};net.players={};net.mode='solo';net.lobby=[]}
function netFail(msg){leaveNet();hideHud();menu(msg)}
function buildLobby(){return[{name:net.name,host:1}].concat(Object.values(net.players).map(p=>({name:p.name})))}
function lobbyUpdate(){net.lobby=buildLobby();broadcast({t:'lobby',list:net.lobby});if(state==='lobby')lobby()}
function hostGame(){
  if(!netOK())return menu("Le module réseau n'a pas pu se charger.");
  leaveNet();net.mode='host';net.code=makeCode();
  let peer;try{peer=net.peer=new Peer(PFX+net.code)}catch(e){return netFail('Réseau indisponible.')}
  peer.on('open',()=>{lobbyUpdate();lobby()});
  peer.on('error',e=>{if(e.type==='unavailable-id')hostGame();else netFail('Erreur réseau : '+(e.type||e))});
  peer.on('connection',c=>{
    net.conns[c.peer]=c;
    c.on('data',m=>hostMsg(c,m));
    c.on('close',()=>{delete net.conns[c.peer];delete net.players[c.peer];if(net.mode==='host'){if(state==='play')checkAllDead();lobbyUpdate()}});
  });
}
function joinGame(code){
  if(!netOK())return menu("Le module réseau n'a pas pu se charger.");
  code=(code||'').toUpperCase().trim();
  if(code.length<4)return menu('Entre le code de la partie.');
  leaveNet();net.mode='client';net.code=code;
  let ok=false;const fail=m=>{if(!ok)netFail(m)};
  let peer;try{peer=net.peer=new Peer()}catch(e){return netFail('Réseau indisponible.')}
  peer.on('error',e=>fail(e.type==='peer-unavailable'?'Partie introuvable : vérifie le code.':'Erreur réseau : '+(e.type||e)));
  peer.on('open',id=>{
    net.myId=id;const c=net.conn=peer.connect(PFX+code,{reliable:true});
    c.on('open',()=>{ok=true;c.send({t:'hello',name:net.name});net.lobby=[];state='lobby';lobby()});
    c.on('data',clientMsg);
    c.on('close',()=>{if(net.mode==='client')netFail("L'hôte a quitté la partie.")});
  });
  setTimeout(()=>fail('Connexion impossible (réseau bloqué ?).'),12000);
}
function hostMsg(c,m){
  if(!m||typeof m!=='object')return;
  const p=net.players[c.peer];
  switch(m.t){
    case 'hello':
      if(state==='play'||state==='cine'){try{c.send({t:'busy'})}catch(e){}return}
      net.players[c.peer]={id:c.peer,name:String(m.name||'Joueur').slice(0,12),x:2,y:2,a:0,hp:100,dead:false,vx:0,vy:0,lt:performance.now(),color:COLORS[(Object.keys(net.players).length+1)%COLORS.length]};
      lobbyUpdate();break;
    case 'p':
      if(p&&Number.isFinite(m.x)&&Number.isFinite(m.y)){
        const now=performance.now(),dt=Math.max(.02,(now-p.lt)/1000);p.lt=now;
        p.vx=(m.x-p.x)/dt;p.vy=(m.y-p.y)/dt;p.x=m.x;p.y=m.y;p.a=+m.a||0;
      }break;
    case 'caught':if(p&&state==='play')hostWin(p.name);break;
    case 'dead':if(p){p.dead=true;checkAllDead()}break;
    case 'pick':if(p&&!p.dead){const i=items.findIndex(it=>Math.hypot(it.x-m.x,it.y-m.y)<.2);if(i>=0){items.splice(i,1);p.hp=Math.min(100,p.hp+35);try{c.send({t:'hp',hp:p.hp,hit:0})}catch(e){}}}break;
  }
}
function clientMsg(m){
  if(!m||typeof m!=='object')return;
  switch(m.t){
    case 'lobby':net.lobby=m.list||[];if(state==='lobby')lobby();break;
    case 'busy':netFail('La partie a déjà commencé.');break;
    case 'start':startLevel(m.level,m.seed,true);break;
    case 's':applySnap(m);break;
    case 'hp':P.hp=m.hp;if(m.hit){hurt=1;shake=.35;sfx.hit()}else{sfx.pick();toast('+ Trousse de soins',1500)}if(P.hp<=0)localDead();break;
    case 'shot':A.flash=.1;sfx.shot(relPan(A.x,A.y),clamp(1.6/(1+Math.hypot(A.x-P.x,A.y-P.y)*.25),.25,1));break;
    case 'win':caught(m.name);break;
    case 'lose':die();break;
  }
}
function applySnap(m){
  if(state!=='play'&&state!=='cine')return;
  if(A.x<-50){A.x=m.A[0];A.y=m.A[1]}
  A.tx=m.A[0];A.ty=m.A[1];
  bullets=m.b.map(b=>({x:b[0],y:b[1],vx:b[2],vy:b[3],w:false}));
  items=m.i.map(i=>({x:i[0],y:i[1]}));
  const ids={};
  for(const q of m.p){
    if(q[0]===net.myId)continue;ids[q[0]]=1;
    let p=net.players[q[0]];
    if(!p)p=net.players[q[0]]={id:q[0],x:q[2],y:q[3],color:COLORS[Object.keys(net.players).length%COLORS.length]};
    p.name=q[1];p.tx=q[2];p.ty=q[3];p.a=q[4];p.hp=q[5];p.dead=!!q[6];
  }
  for(const id in net.players)if(!ids[id])delete net.players[id];
  timeLevel=m.tm;
}
function sendSnap(){
  const pl=[['host',net.name,r2(P.x),r2(P.y),r2(P.a),P.hp,P.dead?1:0]];
  for(const id in net.players){const p=net.players[id];pl.push([id,p.name,r2(p.x),r2(p.y),r2(p.a||0),p.hp,p.dead?1:0])}
  broadcast({t:'s',A:[r2(A.x),r2(A.y)],b:bullets.map(b=>[r2(b.x),r2(b.y),r2(b.vx),r2(b.vy)]),i:items.map(i=>[r2(i.x),r2(i.y)]),p:pl,tm:r2(timeLevel)});
}

function checkAllDead(){if(net.mode!=='host'||state!=='play')return;if(aliveTargets().length===0){broadcast({t:'lose'});die()}}

function updateAuguste(dt){

  A.tg=T;

  A.cd-=dt;A.flash-=dt;

  if(A.state==='move'){
    if(A.los&&dist<3.2&&A.mode!=='flee')pickTarget('flee');

    if(A.state==='move'){
      if(A.pi>=A.path.length){pickTarget('patrol');if(!A.path.length)return}
      const[wx,wy]=tilePos(A.path[A.pi]),dx=wx-A.x,dy=wy-A.y,d=Math.hypot(dx,dy),mv=A.spd*dt;
      if(d<=mv){A.x=wx;A.y=wy;A.pi++}else{A.x+=dx/d*mv;A.y+=dy/d*mv}

function updateBullets(dt){

      if(d<1.3&&!b.w){b.w=true;sfx.whoosh(relPan(b.x,b.y))}

  }

  cv.style.transform=shake>0?`translate(${rnd(-6,6)*shake}px,${rnd(-6,6)*shake}px)`:'';

/* ---------------- Rendu ---------------- */
const pk=(r,g,b)=>0xff000000|((b>255?255:b)<<16)|((g>255?255:g)<<8)|(r>255?255:r);
const lightA=d=>settings.bright*.30*flick/(1+.42*d);
const lightF=d=>(.55+.45*flick)*1.25/(1+.025*d*d);
const sprList=[];
function render(t){
  const dirX=Math.cos(P.a),dirY=Math.sin(P.a),pl=.5*W/H,plX=-dirY*pl,plY=dirX*pl,px=P.x,py=P.y,half=H>>1;
  const tr=1+hurt*.7,tg=.96-hurt*.5,tb=.80-hurt*.5;
  // lampes
  for(let j=0;j<L;j++)for(let i=0;i<L;i++){
    const h=hash2(i+level*7,j);
    const v=h<.2?0:h<.38?(((t*(2+h*8)+h*91)%1)<.78?1:.1):1;
    lampS[j*L+i]=v*(.4+.6*flick);
  }
  // sol & plafond
  for(let y=half+1;y<H;y++){
    const rd=half/(y-half),A_=lightA(rd),F=lightF(rd);
    let fx=px+rd*(dirX-plX),fy=py+rd*(dirY-plY);
    const sx=rd*2*plX/W,sy=rd*2*plY/W;
    let iF=y*W,iC=(H-1-y)*W;
    for(let x=0;x<W;x++){
      let ti=((((fy*64)|0)&63)<<6|(((fx*64)|0)&63))*3;
      let l=(A_+F*cone[iF])*.9;
      buf32[iF]=pk(floorTex[ti]*l*tr,floorTex[ti+1]*l*tg,floorTex[ti+2]*l*tb);
      const cu=(((fy*32)|0)&63)<<6|(((fx*32)|0)&63);
      ti=cu*3;
      if(ceilEm[cu]){
        const li=clamp((fy*.5)|0,0,L-1)*L+clamp((fx*.5)|0,0,L-1),ls=.14+.95*lampS[li];
        buf32[iC]=pk(ceilTex[ti]*ls*tr,ceilTex[ti+1]*ls*tg,ceilTex[ti+2]*ls*tb);
      }else{
        l=(A_+F*cone[iC]*.8)*.9;
        buf32[iC]=pk(ceilTex[ti]*l*tr,ceilTex[ti+1]*l*tg,ceilTex[ti+2]*l*tb);
      }
      fx+=sx;fy+=sy;iF++;iC++;
    }
  }
  // ligne d'horizon
  for(let x=0;x<W;x++)buf32[half*W+x]=0xff000000;
  // murs
  for(let x=0;x<W;x++){
    const cx=2*x/W-1,rdx=dirX+plX*cx,rdy=dirY+plY*cx;
    let mx=px|0,my=py|0;
    const ddx=rdx===0?1e30:Math.abs(1/rdx),ddy=rdy===0?1e30:Math.abs(1/rdy);
    let stx,sty,sdx,sdy;
    if(rdx<0){stx=-1;sdx=(px-mx)*ddx}else{stx=1;sdx=(mx+1-px)*ddx}
    if(rdy<0){sty=-1;sdy=(py-my)*ddy}else{sty=1;sdy=(my+1-py)*ddy}
    let side=0;
    for(;;){
      if(sdx<sdy){sdx+=ddx;mx+=stx;side=0}else{sdy+=ddy;my+=sty;side=1}
      if(mx<0||my<0||mx>=S||my>=S||map[my*S+mx])break;
    }
    if(mx<0||my<0||mx>=S||my>=S){zb[x]=99;continue}
    let pd=side===0?sdx-ddx:sdy-ddy;if(pd<.05)pd=.05;
    zb[x]=pd;
    const lh=(H/pd)|0;let y0=half-(lh>>1),y1=y0+lh;
    const tex=wallTex[tid[my*S+mx]];
    let wx=side===0?py+pd*rdy:px+pd*rdx;wx-=Math.floor(wx);
    let tx=(wx*64)|0;if((side===0&&rdx>0)||(side===1&&rdy<0))tx=63-tx;
    const step=64/lh;let tp=0;if(y0<0){tp=-y0*step;y0=0}if(y1>H)y1=H;
    const sh=side?.8:1,A_=lightA(pd)*sh,F=lightF(pd)*sh*1.05;
    for(let y=y0;y<y1;y++){
      const ti=(((tp&63)<<6)+tx)*3;tp+=step;
      const l=A_+F*cone[y*W+x];
      buf32[y*W+x]=pk(tex[ti]*l*tr,tex[ti+1]*l*tg,tex[ti+2]*l*tb);
    }
  }
  // sprites
  sprList.length=0;
  if(sprA&&A.x>-50)sprList.push({k:0,x:A.x,y:A.y});
  for(const id in net.players){const p=net.players[id];if(!p.dead)sprList.push({k:3,x:p.x,y:p.y,p})}
  for(const b of bullets)sprList.push({k:1,x:b.x,y:b.y});
  for(const it of items)sprList.push({k:2,x:it.x,y:it.y});
  for(const s of sprList)s.d=(s.x-px)*(s.x-px)+(s.y-py)*(s.y-py);
  sprList.sort((a,b)=>b.d-a.d);
  const inv=1/(plX*dirY-dirX*plY);
  for(const s of sprList){
    const sx=s.x-px,sy=s.y-py,tX=inv*(dirY*sx-dirX*sy),tY=inv*(-plY*sx+plX*sy);
    if(tY<.15)continue;
    const scr=(W/2)*(1+tX/tY),unit=H/tY;
    if(s.k===1){ // balle (additif)
      const sz=Math.max(3,unit*.2)|0,cy=half+(.5-.42)*unit,x0=(scr-sz/2)|0,y0=(cy-sz/2)|0;
      for(let x=Math.max(0,x0);x<Math.min(W,x0+sz);x++){
        if(tY>=zb[x])continue;
        for(let y=Math.max(0,y0);y<Math.min(H,y0+sz);y++){
          const dx=(x-x0)/sz*2-1,dy=(y-y0)/sz*2-1,r=Math.sqrt(dx*dx+dy*dy);if(r>=1)continue;
          const v=Math.pow(1-r,1.4),o=buf32[y*W+x];
          buf32[y*W+x]=pk((o&255)+255*v,((o>>8)&255)+170*v,((o>>16)&255)+70*v);
        }
      }
      continue;
    }
    let data,sw_,sh_,hS,bob=0;
    if(s.k===0){data=A.flash>0?sprAF:sprA;sw_=128;sh_=256;hS=.8;bob=Math.sin(clock*(A.state==='move'?9:2))*unit*.012}
    else if(s.k===3){data=playerSprite(s.p);sw_=64;sh_=128;hS=.7}
    else{data=sprMed;sw_=32;sh_=32;hS=.28}
    const sh=(unit*hS)|0,sw=(sh*sw_/sh_)|0,bottom=half+unit*.5+bob,top=bottom-sh,x0=(scr-sw/2)|0;
    const ccx=clamp(scr|0,0,W-1),ccy=clamp(((top+bottom)/2)|0,0,H-1);
    const l=lightA(tY)*1.2+lightF(tY)*cone[ccy*W+ccx]+.12;
    for(let x=Math.max(0,x0);x<Math.min(W,x0+sw);x++){
      if(tY>=zb[x])continue;
      const tx=(((x-x0)*sw_)/sw)|0;
      for(let y=Math.max(0,top|0);y<Math.min(H,bottom|0);y++){
        const ty=(((y-top)*sh_)/sh)|0,i=(ty*sw_+tx)*4;
        if(data[i+3]<70)continue;

      }
    }
  }
  ctx.putImageData(img,0,0);
}
